  <script>
    window.addEventListener('error', function(e) {
      // Ignore generic masked script errors from browser extensions or cross-origin third-party scripts
      if (!e.filename || e.message === 'Script error.' || e.lineno === 0) {
        console.warn('Ignored external script warning:', e);
        return;
      }
      console.error('Captured Error:', e);
      var msg = (e.message || 'Error') + ' at ' + (e.filename || 'unknown') + ':' + e.lineno + ':' + e.colno;
      var existing = document.getElementById('runtime-error-banner');
      if (existing) existing.remove();
      var b = document.createElement('div');
      b.id = 'runtime-error-banner';
      b.style = 'position:fixed;bottom:16px;right:16px;max-width:420px;background:#B42318;color:white;padding:12px 16px;z-index:999999;font-family:Inter,system-ui,sans-serif;font-size:12px;border-radius:12px;box-shadow:0 8px 24px rgba(17,75,95,0.4);display:flex;flex-direction:column;gap:6px;';
      b.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;font-weight:bold;"><span>⚠️ Notification</span><button onclick="this.parentElement.parentElement.remove()" style="background:none;border:none;color:white;cursor:pointer;font-size:14px;">✕</button></div><div>' + msg + '</div>';
      document.body ? document.body.appendChild(b) : document.documentElement.appendChild(b);
      try { fetch('/client-log?err=' + encodeURIComponent(msg)); } catch(err) {}
    });
    window.addEventListener('unhandledrejection', function(e) {
      var msg = e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : 'Unknown rejection';
      console.warn('Unhandled Rejection:', msg);
      try { fetch('/client-log?rejection=' + encodeURIComponent(msg)); } catch(err) {}
    });
  </script>

    const { useState, useEffect, useMemo, useRef } = React;

    // --- SOUND EFFECTS (Web Audio API Synthesizer - Zero External Asset Lag) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
      }
      playChime(type = 'click') {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);

          const now = this.ctx.currentTime;
          if (type === 'click') {
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
            osc.start(now);
            osc.stop(now + 0.08);
          } else if (type === 'ladder_drop') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(220, now + 0.25);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
          } else if (type === 'success') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now); // C5
            osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
            osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
            osc.frequency.setValueAtTime(1046.50, now + 0.24); // C6
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.45);
            osc.start(now);
            osc.stop(now + 0.45);
          } else if (type === 'warning') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.linearRampToValueAtTime(300, now + 0.15);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
          }
        } catch (e) {
          console.warn("Audio chime disabled:", e);
        }
      }
    }

    // Helper: Simple In-Browser QR Code Matrix Generator (100% Offline & Pure Canvas)
    function drawQrCode(canvas, text) {
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const size = canvas.width || 180;
      ctx.clearRect(0, 0, size, size);

      // Clean background
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);

      // Draw pseudo-random reproducible QR pattern based on string hash
      let hash = 0;
      for (let i = 0; i < text.length; i++) {
        hash = (hash << 5) - hash + text.charCodeAt(i);
        hash |= 0;
      }

      const gridCount = 21; // Standard Version 1 QR is 21x21 modules
      const cellSize = Math.floor(size / gridCount);
      const offset = Math.floor((size - cellSize * gridCount) / 2);

      ctx.fillStyle = '#0f172a';

      // Draw 3 Corner Position Markers
      function drawFinderPattern(ox, oy) {
        ctx.fillRect(offset + ox * cellSize, offset + oy * cellSize, 7 * cellSize, 7 * cellSize);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(offset + (ox + 1) * cellSize, offset + (oy + 1) * cellSize, 5 * cellSize, 5 * cellSize);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(offset + (ox + 2) * cellSize, offset + (oy + 2) * cellSize, 3 * cellSize, 3 * cellSize);
      }

      drawFinderPattern(0, 0); // Top-left
      drawFinderPattern(14, 0); // Top-right
      drawFinderPattern(0, 14); // Bottom-left

      // Fill data cells
      for (let r = 0; r < gridCount; r++) {
        for (let c = 0; c < gridCount; c++) {
          // Skip finder patterns
          if ((r < 8 && c < 8) || (r < 8 && c > 12) || (r > 12 && c < 8)) continue;
          // Deterministic seed
          const val = Math.sin(hash * 0.001 + r * 13 + c * 37) * 10000;
          if (val - Math.floor(val) > 0.45) {
            ctx.fillRect(offset + c * cellSize, offset + r * cellSize, cellSize - 0.5, cellSize - 0.5);
          }
        }
      }

// --- PHASE 3: ANIMATED COUNTER ---
const AnimatedCounter = window.AnimatedCounter = function AnimatedCounter({ value, prefix, suffix, className }) {
  var displayed = React.useState(0), setDisplayed = displayed[1]; displayed = displayed[0];
  var prevRef = React.useRef(0);
  React.useEffect(function() {
    var start = prevRef.current, end = typeof value==='number'?value:parseInt(value)||0;
    if (start===end) { setDisplayed(end); return; }
    var dur = 800, t0 = Date.now();
    function tick() {
      var el = Date.now()-t0, p = Math.min(el/dur,1), e = 1-Math.pow(1-p,3);
      setDisplayed(Math.round(start+(end-start)*e));
      if (p<1) requestAnimationFrame(tick); else prevRef.current = end;
    }
    requestAnimationFrame(tick);
  }, [value]);
  return <span className={className}>{prefix||''}{displayed.toLocaleString()}{suffix||''}</span>;
};

  },

      useEffect(() => {

      }, [soundOn]);

      // Time Warp Auto-play loop
      useEffect(() => {
        let interval = null;
        if (isPlaying) {
          interval = setInterval(() => {
            setTimeWarpMinutes(prev => {
              if (prev >= 360) {

                return 360;
              }
              return prev + 5;
            });
          }, 350); // advances 5 minutes every 350ms
        }
        return () => clearInterval(interval);
      }, [isPlaying]);

      // Base Simulated Clock Time: 8:00 PM (20:00)
      const baseClock = useMemo(() => {
        const d = new Date();
        d.setHours(20, 0, 0, 0); // 8:00 PM
        return d;
      }, []);

      const currentSimulatedTime = useMemo(() => {
        const d = new Date(baseClock.getTime() + timeWarpMinutes * 60 * 1000);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
      }, [baseClock, timeWarpMinutes]);

      // --- CORE MATH COMPUTATION FOR ANY DONATION ---
      const computeDonationMetrics = (donation) => {
        const baseConfig = FOOD_BASELINE_TABLE[donation.foodType] || { hours: 3.0 };
        const storageConfig = STORAGE_MULTIPLIERS[donation.storage] || { mult: 1.0 };
        
        // Total safe window in minutes = baseline * storage multiplier
        const totalSafeMinutes = Math.round(baseConfig.hours * 60 * storageConfig.mult);
        // Elapsed time = cookedMinutesAgo + timeWarpMinutes
        const elapsedMinutes = donation.cookedMinutesAgo + timeWarpMinutes;
        // Remaining minutes
        const remainingMinutes = Math.max(0, totalSafeMinutes - elapsedMinutes);
        // Ratio
        const ratio = Math.max(0, Math.min(1.0, remainingMinutes / (totalSafeMinutes || 1)));
        const percentage = Math.round(ratio * 100);

        // Ring color: green (>50%), amber (>20%), red (<=20%), gray (0)
        let ringColor = 'text-brand-500 stroke-brand-500';
        let badgeColor = 'bg-brand-100 text-brand-800 dark:bg-brand-950 dark:text-brand-300 border-brand-300';
        let statusText = 'Fresh & Safe';

        if (percentage <= 0) {
          ringColor = 'text-slate-400 stroke-slate-400';
          badgeColor = 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300 border-slate-400';
          statusText = 'Expired for Humans';
        } else if (percentage <= 20) {
          ringColor = 'text-crimson-500 stroke-crimson-500 animate-pulse';
          badgeColor = 'bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-300 border-red-400';
          statusText = 'CRITICAL WINDOW';
        } else if (percentage <= 50) {
          ringColor = 'text-amber-500 stroke-amber-500';
          badgeColor = 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 border-amber-400';
          statusText = 'Expiring Soon';
        }

        // --- REACHABILITY MATCHING ACROSS RECEIVERS ---
        const donor = donors.find(d => d.id === donation.donorId) || donors[0];

        const matchEvaluations = receivers.map(rec => {
          const distKm = calcDistanceKm(donor, rec);
          // Formula: ETA = distance * 3 min/km + 10 min handling
          const eta = Math.round(distKm * 3 + 10);
          const servingBuffer = 15; // 15 min serving buffer
          const totalTimeNeeded = eta + servingBuffer;

          // Dietary check
          let dietCompatible = true;
          let dietMismatchReason = '';
          if (rec.strictlyVeg && donation.vegType !== 'Veg') {
            dietCompatible = false;
            dietMismatchReason = 'Strictly Pure Veg facility';
          }

          // Reachability validity
          // Receiver valid ONLY if ETA + serving buffer <= remaining safe time AND diet compatible
          const timeValid = totalTimeNeeded <= remainingMinutes;
          const isValid = timeValid && dietCompatible;

          let invalidReason = '';
          if (!timeValid) {
            invalidReason = `ETA (${eta}m) + 15m buffer > ${remainingMinutes}m remaining safe window`;
          } else if (!dietCompatible) {
            invalidReason = `Diet Mismatch: ${dietMismatchReason}`;
          }

          // Score Formula for valid receivers:
          // 0.35 * time_slack + 0.25 * capacity_fit + 0.20 * dietary_fit + 0.20 * trust_score
          let score = 0;
          if (isValid) {
            const timeSlack = Math.min(1.0, Math.max(0.0, (remainingMinutes - totalTimeNeeded) / (totalSafeMinutes || 1)));
            const capacityFit = Math.min(1.0, Math.max(0.3, donation.plates / (rec.capacity || 100)));
            const dietaryFit = donation.dietaryTags.some(t => rec.diet.toLowerCase().includes(t.toLowerCase())) ? 1.0 : 0.8;
            const trustScore = rec.trustScore;

            score = (0.35 * timeSlack) + (0.25 * capacityFit) + (0.20 * dietaryFit) + (0.20 * trustScore);
          }

          return {
            receiver: rec,
            distKm,
            eta,
            totalTimeNeeded,
            isValid,
            invalidReason,
            score: Math.round(score * 100),
            tier: rec.tier
          };
        });

        // Split by Tiers
        const tier1Matches = matchEvaluations.filter(m => m.tier === 1);
        const tier2Matches = matchEvaluations.filter(m => m.tier === 2);
        const tier3Matches = matchEvaluations.filter(m => m.tier === 3);

        // Sort Tier 1 by highest score
        tier1Matches.sort((a, b) => b.score - a.score);

        // Tier 1: Feed People (if any Tier 1 receiver is valid)
        // Tier 2: Animal Feed (if no Tier 1 valid, but safe time for animals e.g. within extended window or dry/veg)
        // Tier 3: Compost / Biogas (if elapsed time too high or spoiled)
        let activeTier = 1;
        let ladderReason = 'Valid Tier 1 NGOs can reach and serve in safe time.';

        const validTier1 = tier1Matches.filter(m => m.isValid);
        if (validTier1.length > 0) {
          activeTier = 1;
          ladderReason = `${validTier1.length} verified NGO(s) reachable before safe consumption window closes.`;
        } else {
          // Check if eligible for Animal Feed (Tier 2)
          // Animal feed allows relaxed window (up to 1.5x human safe time if vegetarian, e.g. gaushala accepts boiled rice/grains)
          const animalSafeMax = totalSafeMinutes * 1.4;
          const isVegOrGrains = donation.vegType === 'Veg';
          const canReachGaushala = tier2Matches.some(m => m.eta <= 90);

          if (elapsedMinutes < animalSafeMax && isVegOrGrains && canReachGaushala) {
            activeTier = 2;
            ladderReason = 'Window closed for human consumption! Automatically stepped down to Tier 2: Animal Feed (Gaushala / Shelter).';
          } else {
            activeTier = 3;
            ladderReason = 'Food expired beyond animal feed threshold. Stepped down to Tier 3: Compost / Biogas Plant (Zero Landfill Methane).';
          }
        }

        return {
          totalSafeMinutes,
          elapsedMinutes,
          remainingMinutes,
          percentage,
          ringColor,
          badgeColor,
          statusText,
          matchEvaluations,
          tier1Matches,
          tier2Matches,
          tier3Matches,
          activeTier,
          ladderReason,
          donor

                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    contents: [{
                      parts: [
                        { text: "Analyze this surplus food photo. Return ONLY a JSON object with: name (title), foodType ('Rice and Curry'|'Roti & Breads'|'Dairy Sweets'|'Fried Snacks'|'Biryani & Meat Curries'), plates (number), vegType ('Veg'|'Non-Veg'), storage ('Hot-Held'|'Room Temp'|'Chilled / Fridge'), cookedMins (number), tags (array), freshnessNote (short string), confidence ('95% Match'). No markdown code fences." },
                        { inline_data: { mime_type: file.type || 'image/jpeg', data: base64Data } }
                      ]
                    }]
                  })

                  <div><strong>Quantity:</strong> {passportModalDonation.plates} plates ({passportModalDonation.vegType})</div>
                  <div><strong>Storage:</strong> {passportModalDonation.storage}</div>
                  <div><strong>Status:</strong> {passportModalDonation.status}</div>
                  <div className="text-[10px] text-brand-600 dark:text-brand-400 font-mono pt-1">
                    ✓ Cryptographic chain-of-custody stamp active
                  </div>
                </div>

                <button
                  onClick={() => {
                    audio.playChime('success');
                    setPassportModalDonation(null);
                  }}
                  className="w-full py-2 rounded-xl bg-slate-900 dark:bg-slate-800 text-white text-xs font-bold"
                >
                  Close Passport
                </button>
              </div>
            </div>
          )}

          {/* =========================================================================
              MODAL: DIGITAL FOOD QUALITY CHECKLIST (FEATURE 4)
             ========================================================================= */}
          {activeQualityChecklistDonation && window.QualityChecklistModal && (
            <window.QualityChecklistModal
              donation={activeQualityChecklistDonation}
              onPass={handleQualityChecklistPass}
              onFail={handleQualityChecklistFail}
              onClose={() => setActiveQualityChecklistDonation(null)}
            />
          )}

          {/* =========================================================================
              MODAL: TWO-WAY RATINGS & TRUST SCORE (FEATURE 5)
             ========================================================================= */}
          {activeRatingModal && window.TwoWayRatingModal && (
            <window.TwoWayRatingModal
              targetEntity={activeRatingModal.targetEntity}
              fromRole={activeRatingModal.fromRole}
              toRole={activeRatingModal.toRole}
              onSubmitRating={handleRatingSubmit}
              onClose={() => setActiveRatingModal(null)}
            />
          )}

          {/* =========================================================================
              MODAL: MISSED-CALL VOICE IVR SIMULATOR (FEATURE 8)
             ========================================================================= */}
          {showVoiceIvrModal && window.MissedCallIVRModal && (
            <window.MissedCallIVRModal
              onListingCreated={(newListing) => {
                const newId = `DON-${100 + donations.length + 1}`;
                const created = {
                  id: newId,
                  ...newListing,
                  status: 'Listed',
                  assignedReceiverId: null,
                  assignedVolunteerId: null,
                  volunteerSimulatedNear: 'far',
                  custodyLog: [
                    { time: currentSimulatedTime, event: `Registered via Missed-Call Voice Assistant (IVR Bot)`, by: 'IVR Bot' }
                  ],
                  timestamp: Date.now() - (45 * 60 * 1000)
                };
                setDonations([created, ...donations]);
                setSelectedDonationId(newId);
                setActiveTab('active_feed');
                audio.playChime('success');
              }}
              onClose={() => setShowVoiceIvrModal(false)}
            />
          )}

          {/* =========================================================================
              MODAL 2: CSR / ESG IMPACT CERTIFICATE MODAL (FEATURE #7)
             ========================================================================= */}
          {certificateModalDonor && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
              <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 max-w-lg w-full border border-slate-200 dark:border-slate-800 shadow-2xl space-y-5">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🏆</span>
                    <h3 className="text-base font-bold text-slate-900 dark:text-slate-100">
                      ESG / CSR Impact Certificate
                    </h3>
                  </div>
                  <button
                    onClick={() => setCertificateModalDonor(null)}
                    className="w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-800 flex items-center justify-center text-sm"
                  >
                    ✕
                  </button>
                </div>

                {/* Branded Certificate Frame */}
                <div className="p-6 rounded-2xl bg-gradient-to-b from-emerald-50/70 to-slate-50 dark:from-emerald-950/30 dark:to-slate-900 border-2 border-emerald-400/40 text-center space-y-4 shadow-sm">
                  <div className="w-14 h-14 mx-auto rounded-full bg-emerald-600 text-white flex items-center justify-center text-2xl shadow-md">
                    🎖️
                  </div>
                  <div>
                    <h4 className="text-xs uppercase tracking-widest text-emerald-700 dark:text-emerald-400 font-bold">
                      Certificate of Environmental & Social Action
                    </h4>
                    <p className="text-sm font-extrabold text-slate-900 dark:text-slate-100 mt-1">
                      Presented to {certificateModalDonor.name}
                    </p>
                    <p className="text-xs text-slate-500 mt-0.5">
                      For exemplary leadership in zero-waste food rescue & hunger relief
                    </p>
                  </div>

                  {/* Impact Stats in Certificate */}
                  <div className="grid grid-cols-2 gap-3 pt-2">
                    <div className="p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-emerald-200 dark:border-emerald-800/50">
                      <div className="text-lg font-black text-brand-600 dark:text-brand-400">
                        {impactStats.totalDiverted} Plates
                      </div>
                      <div className="text-[10px] text-slate-500 uppercase font-semibold">100% Landfill Diverted</div>
                    </div>

                    <div className="p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-emerald-200 dark:border-emerald-800/50">
                      <div className="text-lg font-black text-purple-600 dark:text-purple-400">
                        {impactStats.co2AvoidedKg} kg CO₂e
                      </div>
                      <div className="text-[10px] text-slate-500 uppercase font-semibold">Emissions Avoided</div>
                    </div>
                  </div>

                  {/* SDG Alignment Badges */}
                  <div className="flex items-center justify-center gap-2 pt-1 text-[10px] font-bold">
                    <span className="px-2 py-0.5 rounded bg-amber-100 text-amber-800 border border-amber-300">
                      SDG 2: Zero Hunger
                    </span>
                    <span className="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 border border-emerald-300">
                      SDG 12: Responsible Consumption
                    </span>
                    <span className="px-2 py-0.5 rounded bg-blue-100 text-blue-800 border border-blue-300">
                      SDG 13: Climate Action
                    </span>
                  </div>

                  <div className="text-[10px] font-mono text-slate-400 pt-2 border-t border-slate-200 dark:border-slate-800 flex justify-between">
                    <span>ID: CERT-SANJEEVNI-2026-9812</span>
                    <span>Verified by Sanjeevni Network</span>
                  </div>
                </div>

                <div className="flex gap-3">
                  <button
                    onClick={() => {
                      audio.playChime('click');
                      if (window.generateESGCertificate) {
                        window.generateESGCertificate(certificateModalDonor);
                      } else {
                        window.print();
                      }
                    }}
                    className="flex-1 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow-md transition flex items-center justify-center gap-2"
                  >
                    <span>📄</span> Download Certified ESG PDF
                  </button>
                  <button
                    onClick={() => setCertificateModalDonor(null)}
                    className="px-4 py-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 text-slate-700 dark:text-slate-300 font-bold text-xs transition"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* =========================================================================
              MODAL 3: SAFETY & HONESTY DISCLAIMER MODAL
             ========================================================================= */}
          {showSafetyDisclaimer && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
              <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 max-w-md w-full border border-slate-200 dark:border-slate-800 shadow-2xl space-y-4">
                <div className="flex items-center justify-between pb-2 border-b border-slate-100 dark:border-slate-800">
                  <div className="flex items-center gap-2 text-amber-600">
                    <span className="text-xl">⚠️</span>
                    <h3 className="text-sm font-bold text-slate-900 dark:text-slate-100">
                      Safety, Hygiene & Legal Disclaimer
                    </h3>
                  </div>
                  <button
                    onClick={() => setShowSafetyDisclaimer(false)}
                    className="w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-800 flex items-center justify-center text-sm"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-2 text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                  <p>
                    <strong>1. Prototype Demonstration Only:</strong> This hackathon software prototype models surplus decay kinetics using approximate microbiological parameters. It does <em>not</em> certify microbiological food safety in a clinical or regulatory sense.
                  </p>
                  <p>
                    <strong>2. Real-World Requirements:</strong> Full production deployment requires FSSAI hygiene checklists, verified cold-chain logs, tamper-evident thermal container inspections, and verified NGO partnership MoUs.
                  </p>
                  <p>
                    <strong>3. Safe-Hours Approximation:</strong> The baseline decay table is an engineering approximation based on temperature danger zones (5°C - 60°C). Real-world dishes require physical sensor telemetry.
                  </p>
                </div>

                <button
                  onClick={() => setShowSafetyDisclaimer(false)}
                  className="w-full py-2 rounded-xl bg-slate-900 dark:bg-slate-800 text-white text-xs font-bold"
                >
                  Understood & Acknowledged
                </button>
              </div>
            </div>
          )}

          {/* GUIDED DEMO OVERLAY BAR (PHASE 1) */}
          {window.GuidedDemoOverlay && (
            <GuidedDemoOverlay
              isRunning={demoRunning}
              currentStep={demoStepIndex + 1}
              totalSteps={10}
              caption={demoCaption}
              progress={demoProgress}
              onStop={stopGuidedDemo}
            />
          )}

          {/* WHY THIS MATTERS MODAL (PHASE 8 PITCH POLISH) */}
          {showWhyModal && window.WhyThisMattersModal && (
            <WhyThisMattersModal onClose={() => setShowWhyModal(false)} />
          )}

          {/* AUTH & ROLE-BASED ACCESS CONTROL MODAL (SECTION 4) */}
          {window.AuthModal && (
            <AuthModal
              isOpen={showAuthModal}
              onClose={() => setShowAuthModal(false)}
              onAuthSuccess={(user) => {
                setCurrentSession(user);
                addToast(`Logged in as ${user.name} (${user.role})`, 'success', '👤');
                if (user.role === 'Food Donor') setActiveTab('dashboard_donor');
                else if (user.role === 'NGO / Food Receiver') setActiveTab('dashboard_ngo');
                else if (user.role === 'Volunteer') setActiveTab('dashboard_volunteer');
                else if (user.role === 'Animal Welfare Organisation') setActiveTab('dashboard_animal');
                else if (user.role === 'Waste Processing Partner') setActiveTab('dashboard_waste');
                else if (user.role === 'Admin') setActiveTab('dashboard_admin');
              }}
              currentSession={currentSession}
              onLogout={() => {
                setCurrentSession(null);
                addToast('Signed out of session', 'info', '👋');
              }}
            />
          )}

          {/* FOOD DONATION FORM MODAL (3-STEP GUIDED WIZARD) */}
          {window.FoodDonationModal && (
            <FoodDonationModal
              isOpen={showDonationModal}
              initialPathway={donationInitialPathway}
              onClose={() => setShowDonationModal(false)}
              onCreated={() => {
                if (window.SanjeevniAPI) {
                  window.SanjeevniAPI.getDonations().then(d => {
                    if (d && d.length) setDonations(d);
                  });
                }
                addToast('Surplus donation posted! KARN pickup registered.', 'success', '🍲');
              }}
              currentDonor={currentSession}
            />
          )}

          {/* KARN LIVE TELEMETRY MODAL */}
          {window.KarnTrackerModal && karnModalDonationId && (
            <KarnTrackerModal
              isOpen={Boolean(karnModalDonationId)}
              donationId={karnModalDonationId}
              onClose={() => setKarnModalDonationId(null)}
            />
          )}

          {/* Sticky Mobile Donate Bar (Strict Coral Action Token) */}
          <div className="sm:hidden fixed bottom-0 left-0 right-0 z-40 p-2.5 bg-[#114B5F] border-t border-[#0d3949] shadow-2xl flex items-center justify-between gap-3">
            <button
              onClick={() => setShowDonationModal(true)}
              className="w-full py-2.5 px-4 rounded-xl bg-[#F45B69] hover:bg-[#e04856] text-[#072A35] font-black text-xs shadow-lg transition active:scale-95 flex items-center justify-center gap-2"
            >
              <span>🍲</span>
              <span>+ Post Surplus Food (Donate Now)</span>
            </button>
          </div>

          {/* Persistent Footer: Deep Lagoon (#114B5F) background with #F7FEF6 text */}
          <footer className="mt-auto border-t border-[#0d3949] bg-[#114B5F] text-[#F7FEF6] py-5 px-4 text-center text-xs mb-12 sm:mb-0">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
              <div>
                <strong>SANJEEVNI</strong> • Saving Food. Nourishing Lives.
              </div>
              <div className="text-[11px] text-[#E4FDE1] font-semibold">
                Built at MLH HackDay, AITR Indore • Real-Time Food Decay & Reachability Engine
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // Render the React application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
